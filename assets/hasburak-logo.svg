<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Hasburak Kuyumculuk">
    <defs>
        <linearGradient id="hbGold" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#F8E9B6"/>
            <stop offset="35%"  stop-color="#E5C674"/>
            <stop offset="55%"  stop-color="#D4AF37"/>
            <stop offset="100%" stop-color="#9A7A14"/>
        </linearGradient>
        <filter id="hbGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="0.7" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- ═════ TAÇ ORNAMENT (üst, simetrik filigree — Halil abinin tasarımına yakın) ═════ -->
    <g transform="translate(360, 70)" fill="url(#hbGold)" filter="url(#hbGlow)">
        <!-- Tepe nokta -->
        <circle cx="0" cy="-58" r="3.2"/>
        <!-- Tepe elmas -->
        <path d="M0 -54 L5 -42 L0 -32 L-5 -42 Z"/>
        <!-- Merkez yaprak/damla -->
        <path d="M0 -32 C 5 -24, 7 -12, 7 0 C 5 6, 2 9, 0 11 C -2 9, -5 6, -7 0 C -7 -12, -5 -24, 0 -32 Z"/>
        <!-- İç süs kıvrımlar (sol) -->
        <path d="M-7 0 C -16 4, -26 4, -34 0 C -26 -3, -16 -3, -7 0 Z"/>
        <!-- İç süs kıvrımlar (sağ) -->
        <path d="M7 0 C 16 4, 26 4, 34 0 C 26 -3, 16 -3, 7 0 Z"/>
        <!-- Dış uzun kıvrımlar (sol) -->
        <path d="M-34 0 C -52 -5, -68 -12, -82 -6 C -72 -14, -58 -12, -46 -7 C -38 -6, -34 -3, -34 0 Z"/>
        <!-- Dış uzun kıvrımlar (sağ) -->
        <path d="M34 0 C 52 -5, 68 -12, 82 -6 C 72 -14, 58 -12, 46 -7 C 38 -6, 34 -3, 34 0 Z"/>
        <!-- Uç noktalar (sol) -->
        <circle cx="-88" cy="-4" r="2.4"/>
        <!-- Uç noktalar (sağ) -->
        <circle cx="88"  cy="-4" r="2.4"/>
        <!-- İç küçük noktalar -->
        <circle cx="-20" cy="-4" r="1.2"/>
        <circle cx="20"  cy="-4" r="1.2"/>
        <!-- Alt küçük süsleme -->
        <path d="M0 13 L3 19 L0 24 L-3 19 Z"/>
    </g>

    <!-- ═════ HASBURAK (ana yazı) ═════ -->
    <text x="360" y="220"
          font-family="'Cormorant Garamond', 'Times New Roman', serif"
          font-size="104"
          font-weight="500"
          fill="#FFFCF7"
          text-anchor="middle"
          letter-spacing="10">HASBURAK</text>

    <!-- ═════ KUYUMCULUK (alt yazı — direkt HASBURAK altında, çizgi yok) ═════ -->
    <text x="360" y="278"
          font-family="'Cormorant Garamond', 'Times New Roman', serif"
          font-size="28"
          font-weight="500"
          fill="#FFFCF7"
          text-anchor="middle"
          letter-spacing="14">KUYUMCULUK</text>
</svg>
