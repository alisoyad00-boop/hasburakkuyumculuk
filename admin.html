<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex, nofollow">
<title>Admin Panel · Hasburak Sarrafiye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --bg: #060E2C;
        --bg-2: #0a1340;
        --surface: rgba(255, 255, 255, 0.04);
        --surface-2: rgba(255, 255, 255, 0.07);
        --border: rgba(255, 255, 255, 0.1);
        --gold: #c9a85b;
        --gold-2: #e9d294;
        --text: #faf6ee;
        --muted: rgba(250, 246, 238, 0.55);
        --danger: #e57373;
        --success: #6cc788;
    }
    html, body { height: 100%; }
    body {
        background: linear-gradient(180deg, var(--bg), var(--bg-2));
        color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        min-height: 100vh;
    }
    a { color: var(--gold-2); text-decoration: none; }
    .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(6, 14, 44, 0.85);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }
    .topbar-brand {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.4rem;
        letter-spacing: 0.04em;
    }
    .topbar-brand b { color: var(--gold-2); font-weight: 600; }
    .topbar-meta {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 0.82rem;
        color: var(--muted);
    }
    .btn {
        background: var(--gold);
        color: #1a1208;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9rem;
        font-family: inherit;
        transition: transform 0.15s, background 0.15s, opacity 0.15s;
    }
    .btn:hover { background: var(--gold-2); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
    }
    .btn.secondary:hover { background: var(--surface-2); }
    .btn.danger {
        background: rgba(229, 115, 115, 0.15);
        color: var(--danger);
        border: 1px solid rgba(229, 115, 115, 0.3);
    }
    .btn.danger:hover { background: rgba(229, 115, 115, 0.25); }
    .btn.small { padding: 6px 12px; font-size: 0.8rem; }

    /* ─── LOGIN ─── */
    .login-wrap {
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }
    .login-card {
        max-width: 420px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 36px 32px;
        backdrop-filter: blur(20px);
    }
    .login-card h1 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.8rem;
        margin-bottom: 8px;
        letter-spacing: 0.02em;
    }
    .login-card p.sub { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
        display: block;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 6px;
    }
    input[type="text"],
    input[type="password"],
    input[type="url"],
    select,
    textarea {
        width: 100%;
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 11px 14px;
        font-size: 0.92rem;
        font-family: inherit;
        transition: border-color 0.15s;
    }
    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: var(--gold);
    }
    select {
        appearance: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1l5 5 5-5' stroke='%23c9a85b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
        background-repeat: no-repeat;
        background-position: right 14px center;
        padding-right: 36px;
    }
    textarea { resize: vertical; min-height: 70px; }
    .alert {
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 0.88rem;
        margin-top: 12px;
        display: none;
    }
    .alert.error {
        background: rgba(229, 115, 115, 0.1);
        border: 1px solid rgba(229, 115, 115, 0.3);
        color: var(--danger);
    }
    .alert.success {
        background: rgba(108, 199, 136, 0.1);
        border: 1px solid rgba(108, 199, 136, 0.3);
        color: var(--success);
    }
    .alert.show { display: block; }

    /* ─── DASHBOARD ─── */
    .dash {
        max-width: 1400px;
        margin: 0 auto;
        padding: 28px 24px 80px;
    }
    .dash-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 24px;
    }
    .dash-header h2 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.8rem;
        font-weight: 600;
    }
    .dash-header .stats {
        color: var(--muted);
        font-size: 0.88rem;
    }
    .dash-toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
    }
    .dash-toolbar input[type="search"] {
        flex: 1;
        min-width: 220px;
        max-width: 320px;
    }
    .dash-toolbar select { max-width: 200px; }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
    }
    .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover { transform: translateY(-2px); border-color: rgba(201, 168, 91, 0.3); }
    .card-img {
        position: relative;
        aspect-ratio: 4 / 5;
        background: var(--surface-2);
        overflow: hidden;
    }
    .card-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .card-img .badge {
        position: absolute;
        top: 8px;
        left: 8px;
        background: rgba(6, 14, 44, 0.8);
        color: var(--gold-2);
        font-size: 0.7rem;
        padding: 4px 8px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }
    .card-body {
        padding: 12px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .card-name { font-weight: 600; font-size: 0.95rem; line-height: 1.3; }
    .card-cat { color: var(--muted); font-size: 0.78rem; }
    .card-actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
    }
    .card-actions .btn {
        flex: 1;
        padding: 6px 8px;
        font-size: 0.78rem;
    }

    /* ─── MODAL ─── */
    .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: 14px;
        max-width: 540px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        padding: 26px 28px;
    }
    .modal h3 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.5rem;
        margin-bottom: 6px;
    }
    .modal p.sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 22px; }
    .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 22px;
    }
    .img-preview {
        margin-top: 12px;
        aspect-ratio: 4 / 5;
        max-width: 160px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        display: none;
    }
    .img-preview.show { display: block; }
    .img-preview img { width: 100%; height: 100%; object-fit: cover; }

    /* ─── Upload zone ─── */
    .upload-zone {
        position: relative;
        border: 1.5px dashed var(--border);
        border-radius: 10px;
        background: var(--surface-2);
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
    }
    .upload-zone:hover,
    .upload-zone.is-drag {
        border-color: var(--gold);
        background: rgba(201, 168, 91, 0.06);
    }
    .upload-zone-inner {
        padding: 22px 18px;
        display: flex;
        align-items: center;
        gap: 16px;
        color: var(--gold-2);
    }
    .upload-zone-text { display: flex; flex-direction: column; line-height: 1.4; }
    .upload-zone-text strong { color: var(--text); font-size: 0.95rem; font-weight: 600; }
    .upload-zone-text span { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
    .upload-progress {
        padding: 16px 18px;
        color: var(--gold-2);
        font-size: 0.88rem;
        text-align: center;
    }
    .upload-progress-text::before {
        content: '';
        display: inline-block;
        width: 14px; height: 14px;
        margin-right: 8px;
        border: 2px solid rgba(201, 168, 91, 0.3);
        border-top-color: var(--gold);
        border-radius: 50%;
        vertical-align: -2px;
        animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .url-fallback {
        margin-top: 10px;
        font-size: 0.82rem;
    }
    .url-fallback summary {
        cursor: pointer;
        color: var(--muted);
        padding: 4px 0;
        user-select: none;
    }
    .url-fallback summary:hover { color: var(--gold-2); }
    .url-fallback input { margin-top: 8px; }

    .empty {
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
    }
    .empty h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; margin-bottom: 8px; }
    .loader { color: var(--muted); padding: 40px; text-align: center; }
    .hidden { display: none !important; }

    @media (max-width: 600px) {
        .topbar { padding: 12px 16px; }
        .topbar-meta { gap: 8px; font-size: 0.75rem; }
        .topbar-meta .user { display: none; }
        .dash { padding: 20px 14px 60px; }
        .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    }
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <div class="topbar-brand">
        <b>Hasburak</b> <span style="color: var(--muted); font-size: 0.85rem; margin-left: 6px;">Admin</span>
    </div>
    <div class="topbar-meta" id="topMeta">
        <span class="user" id="topUser"></span>
        <button class="btn secondary small" id="logoutBtn" hidden>Çıkış</button>
    </div>
</header>

<!-- LOGIN VIEW -->
<section class="login-wrap" id="loginView">
    <div class="login-card">
        <h1>Yönetici Girişi</h1>
        <p class="sub">Ürünleri eklemek, düzenlemek veya silmek için giriş yap.</p>
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="loginUser">Kullanıcı Adı</label>
                <input type="text" id="loginUser" required autocomplete="username" spellcheck="false" autocapitalize="off">
            </div>
            <div class="form-group">
                <label for="loginPass">Şifre</label>
                <input type="password" id="loginPass" required autocomplete="current-password">
            </div>
            <button class="btn" type="submit" id="loginBtn" style="width: 100%; margin-top: 6px;">Giriş Yap</button>
            <div class="alert error" id="loginAlert"></div>
        </form>
    </div>
</section>

<!-- DASHBOARD VIEW -->
<section class="dash hidden" id="dashView">
    <div class="dash-header">
        <div>
            <h2>Ürün Yönetimi</h2>
            <p class="stats" id="stats">Yükleniyor...</p>
        </div>
        <button class="btn" id="addBtn">+ Yeni Ürün Ekle</button>
    </div>

    <div class="dash-toolbar">
        <input type="search" id="searchBox" placeholder="Ürün ara..." spellcheck="false" autocomplete="off">
        <select id="filterCat">
            <option value="">Tüm kategoriler</option>
        </select>
    </div>

    <div class="alert success" id="dashSuccess"></div>
    <div class="alert error" id="dashError"></div>

    <div id="gridArea">
        <div class="loader">Ürünler yükleniyor...</div>
    </div>
</section>

<!-- ADD/EDIT MODAL -->
<div class="modal-backdrop" id="modal">
    <div class="modal">
        <h3 id="modalTitle">Yeni Ürün</h3>
        <p class="sub">Tüm alanlar zorunludur.</p>
        <form id="productForm" autocomplete="off">
            <input type="hidden" id="pId">
            <div class="form-group">
                <label for="pName">Ürün Adı</label>
                <input type="text" id="pName" required maxlength="120" placeholder="Örn: Klasik Alyans">
            </div>
            <div class="form-group">
                <label for="pCategory">Kategori</label>
                <select id="pCategory" required></select>
            </div>
            <div class="form-group">
                <label for="pTag">Etiket (rozet)</label>
                <input type="text" id="pTag" maxlength="60" placeholder="Örn: 14 Ayar, Pırlanta, Yatırım">
            </div>
            <div class="form-group">
                <label>Fotoğraf</label>
                <div class="upload-zone" id="uploadZone">
                    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" hidden>
                    <div class="upload-zone-inner" id="uploadZoneInner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="36" height="36" aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <div class="upload-zone-text">
                            <strong>Fotoğraf yükle</strong>
                            <span>Tıkla ya da sürükle bırak (JPG, PNG, WEBP — en fazla 4 MB)</span>
                        </div>
                    </div>
                    <div class="upload-progress" id="uploadProgress" hidden>
                        <span class="upload-progress-text" id="uploadProgressText">Yükleniyor...</span>
                    </div>
                </div>
                <div class="img-preview" id="imgPreview">
                    <img id="imgPreviewSrc" src="" alt="">
                </div>
                <details class="url-fallback">
                    <summary>veya URL ile ekle</summary>
                    <input type="url" id="pImage" placeholder="https://...">
                </details>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn secondary" id="cancelBtn">İptal</button>
                <button type="submit" class="btn" id="saveBtn">Kaydet</button>
            </div>
            <div class="alert error" id="modalError"></div>
        </form>
    </div>
</div>

<script>
(function() {
    'use strict';

    const API = {
        login: '/api/admin/login',
        adminProducts: '/api/admin/products',
    };
    const TOKEN_KEY = 'hb_admin_token';
    const USER_KEY = 'hb_admin_user';

    // Cached state
    let products = [];
    let categories = [];
    let editingId = null;

    // ─── Helpers ───
    const $ = (id) => document.getElementById(id);
    const showAlert = (el, msg, kind = 'error') => {
        el.textContent = msg;
        el.classList.remove('error', 'success');
        el.classList.add(kind, 'show');
    };
    const hideAlert = (el) => el.classList.remove('show');
    const flash = (msg, kind = 'success') => {
        const el = kind === 'error' ? $('dashError') : $('dashSuccess');
        showAlert(el, msg, kind);
        setTimeout(() => hideAlert(el), 3500);
    };

    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    function setToken(t, user) {
        localStorage.setItem(TOKEN_KEY, t);
        if (user) localStorage.setItem(USER_KEY, user);
    }
    function clearToken() {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
    }

    async function api(url, opts = {}) {
        const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
        const token = getToken();
        if (token) headers.Authorization = 'Bearer ' + token;
        const r = await fetch(url, { ...opts, headers });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
            const msg = data.error || `HTTP ${r.status}`;
            const err = new Error(msg);
            err.status = r.status;
            throw err;
        }
        return data;
    }

    // ─── LOGIN ───
    $('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = $('loginUser').value.trim();
        const password = $('loginPass').value;
        const btn = $('loginBtn');
        const alertEl = $('loginAlert');
        hideAlert(alertEl);
        btn.disabled = true;
        btn.textContent = 'Giriş yapılıyor...';
        try {
            const data = await api(API.login, { method: 'POST', body: JSON.stringify({ username, password }) });
            setToken(data.token, username);
            await showDashboard();
        } catch (e) {
            showAlert(alertEl, e.message || 'Giriş başarısız.');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Giriş Yap';
        }
    });

    $('logoutBtn').addEventListener('click', () => {
        clearToken();
        $('dashView').classList.add('hidden');
        $('loginView').classList.remove('hidden');
        $('logoutBtn').hidden = true;
        $('topUser').textContent = '';
        $('loginPass').value = '';
    });

    // ─── DASHBOARD ───
    async function showDashboard() {
        $('loginView').classList.add('hidden');
        $('dashView').classList.remove('hidden');
        $('logoutBtn').hidden = false;
        $('topUser').textContent = localStorage.getItem(USER_KEY) || '';
        await loadProducts();
    }

    async function loadProducts() {
        $('gridArea').innerHTML = '<div class="loader">Ürünler yükleniyor...</div>';
        try {
            const data = await api(API.adminProducts);
            products = data.products || [];
            categories = data.categories || [];
            // Populate filter dropdowns
            const filterSel = $('filterCat');
            const formSel = $('pCategory');
            filterSel.innerHTML = '<option value="">Tüm kategoriler</option>' +
                categories.map(c => `<option value="${c.key}">${escapeHtml(c.label)}</option>`).join('');
            formSel.innerHTML = categories.map(c => `<option value="${c.key}">${escapeHtml(c.label)}</option>`).join('');
            renderGrid();
        } catch (e) {
            if (e.status === 401) {
                clearToken();
                $('dashView').classList.add('hidden');
                $('loginView').classList.remove('hidden');
                $('logoutBtn').hidden = true;
                showAlert($('loginAlert'), 'Oturumun süresi dolmuş. Tekrar giriş yap.');
                return;
            }
            $('gridArea').innerHTML = `<div class="empty"><h3>Yüklenemedi</h3><p>${escapeHtml(e.message)}</p></div>`;
        }
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function fold(s) {
        return (s || '').toLocaleLowerCase('tr')
            .replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ğ/g, 'g')
            .replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c');
    }

    function renderGrid() {
        const search = fold($('searchBox').value.trim());
        const cat = $('filterCat').value;
        const filtered = products.filter(p => {
            if (cat && p.category !== cat) return false;
            if (search) {
                const hay = fold(`${p.name} ${p.tag} ${p.category}`);
                if (!hay.includes(search)) return false;
            }
            return true;
        });
        $('stats').textContent = `Toplam ${products.length} ürün${cat || search ? ` · ${filtered.length} eşleşme` : ''}`;
        if (!filtered.length) {
            $('gridArea').innerHTML = `<div class="empty"><h3>Ürün yok</h3><p>${products.length === 0 ? 'Henüz ürün eklenmedi.' : 'Filtreyle eşleşen ürün bulunamadı.'}</p></div>`;
            return;
        }
        const catLabel = (k) => (categories.find(c => c.key === k) || {}).label || k;
        $('gridArea').innerHTML = '<div class="grid">' + filtered.map(p => `
            <div class="card">
                <div class="card-img">
                    ${p.tag ? `<span class="badge">${escapeHtml(p.tag)}</span>` : ''}
                    <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.alt || p.name)}" loading="lazy" onerror="this.style.opacity='0.3'">
                </div>
                <div class="card-body">
                    <div class="card-name">${escapeHtml(p.name)}</div>
                    <div class="card-cat">${escapeHtml(catLabel(p.category))}</div>
                    <div class="card-actions">
                        <button class="btn secondary small" data-edit="${escapeHtml(p.id)}">Düzenle</button>
                        <button class="btn danger small" data-del="${escapeHtml(p.id)}">Sil</button>
                    </div>
                </div>
            </div>
        `).join('') + '</div>';

        // Attach handlers
        $('gridArea').querySelectorAll('[data-edit]').forEach(btn =>
            btn.addEventListener('click', () => openEdit(btn.dataset.edit)));
        $('gridArea').querySelectorAll('[data-del]').forEach(btn =>
            btn.addEventListener('click', () => doDelete(btn.dataset.del)));
    }

    $('searchBox').addEventListener('input', () => renderGrid());
    $('filterCat').addEventListener('change', () => renderGrid());

    // ─── MODAL ───
    function openModal() {
        $('modal').classList.add('show');
        document.body.style.overflow = 'hidden';
    }
    function closeModal() {
        $('modal').classList.remove('show');
        document.body.style.overflow = '';
        editingId = null;
        $('productForm').reset();
        $('pId').value = '';
        $('imgPreview').classList.remove('show');
        setUploadingState(false);
        hideAlert($('modalError'));
    }
    $('addBtn').addEventListener('click', () => {
        editingId = null;
        $('modalTitle').textContent = 'Yeni Ürün';
        $('saveBtn').textContent = 'Kaydet';
        $('productForm').reset();
        $('pId').value = '';
        $('imgPreview').classList.remove('show');
        openModal();
        setTimeout(() => $('pName').focus(), 100);
    });
    $('cancelBtn').addEventListener('click', closeModal);
    $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('modal').classList.contains('show')) closeModal(); });

    function openEdit(id) {
        const p = products.find(x => x.id === id);
        if (!p) return;
        editingId = id;
        $('modalTitle').textContent = 'Ürünü Düzenle';
        $('saveBtn').textContent = 'Güncelle';
        $('pId').value = p.id;
        $('pName').value = p.name || '';
        $('pCategory').value = p.category || '';
        $('pTag').value = p.tag || '';
        $('pImage').value = p.image || '';
        if (p.image) {
            $('imgPreviewSrc').src = p.image;
            $('imgPreview').classList.add('show');
        }
        openModal();
    }

    $('pImage').addEventListener('input', () => {
        const v = $('pImage').value.trim();
        if (v && /^https?:\/\//.test(v)) {
            $('imgPreviewSrc').src = v;
            $('imgPreview').classList.add('show');
        } else {
            $('imgPreview').classList.remove('show');
        }
    });

    // ─── FILE UPLOAD ───
    const uploadZone = $('uploadZone');
    const fileInput = $('fileInput');
    const uploadInner = $('uploadZoneInner');
    const uploadProgress = $('uploadProgress');
    const uploadProgressText = $('uploadProgressText');

    function setUploadingState(isUploading, msg) {
        if (isUploading) {
            uploadInner.hidden = true;
            uploadProgress.hidden = false;
            uploadProgressText.textContent = msg || 'Yükleniyor...';
        } else {
            uploadInner.hidden = false;
            uploadProgress.hidden = true;
        }
    }

    async function uploadFile(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            showAlert($('modalError'), 'Sadece resim dosyası yükleyebilirsin.');
            return;
        }
        if (file.size > 4 * 1024 * 1024) {
            showAlert($('modalError'), 'Dosya çok büyük (en fazla 4 MB). Daha küçük bir resim seç ya da WhatsApp\'tan boyutu küçülterek yolla.');
            return;
        }
        hideAlert($('modalError'));
        setUploadingState(true, `Yükleniyor: ${file.name}`);
        try {
            const token = getToken();
            const r = await fetch('/api/admin/upload', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': file.type,
                    'x-filename': encodeURIComponent(file.name),
                },
                body: file,
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
            // Set the URL into the form, show preview
            $('pImage').value = data.url;
            $('imgPreviewSrc').src = data.url;
            $('imgPreview').classList.add('show');
            setUploadingState(false);
        } catch (e) {
            showAlert($('modalError'), 'Yükleme başarısız: ' + (e.message || ''));
            setUploadingState(false);
        }
    }

    uploadZone.addEventListener('click', (e) => {
        // Don't trigger when clicking the URL fallback details
        if (e.target.closest('.url-fallback')) return;
        fileInput.click();
    });
    fileInput.addEventListener('change', () => {
        if (fileInput.files && fileInput.files[0]) {
            uploadFile(fileInput.files[0]);
            fileInput.value = ''; // allow re-selecting same file
        }
    });
    ['dragenter', 'dragover'].forEach(ev =>
        uploadZone.addEventListener(ev, (e) => {
            e.preventDefault();
            uploadZone.classList.add('is-drag');
        }));
    ['dragleave', 'drop'].forEach(ev =>
        uploadZone.addEventListener(ev, (e) => {
            e.preventDefault();
            uploadZone.classList.remove('is-drag');
        }));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) uploadFile(file);
    });

    $('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert($('modalError'));
        const payload = {
            name: $('pName').value.trim(),
            category: $('pCategory').value,
            tag: $('pTag').value.trim(),
            image: $('pImage').value.trim(),
        };
        if (!payload.image) {
            showAlert($('modalError'), 'Lütfen bir fotoğraf yükle veya URL gir.');
            return;
        }
        const btn = $('saveBtn');
        btn.disabled = true;
        const orig = btn.textContent;
        btn.textContent = 'Kaydediliyor...';
        try {
            if (editingId) {
                await api(API.adminProducts, {
                    method: 'PUT',
                    body: JSON.stringify({ id: editingId, ...payload }),
                });
                flash('Ürün güncellendi.');
            } else {
                await api(API.adminProducts, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                });
                flash('Yeni ürün eklendi.');
            }
            closeModal();
            await loadProducts();
        } catch (e) {
            showAlert($('modalError'), e.message || 'Kaydedilemedi.');
        } finally {
            btn.disabled = false;
            btn.textContent = orig;
        }
    });

    async function doDelete(id) {
        const p = products.find(x => x.id === id);
        if (!p) return;
        if (!confirm(`"${p.name}" silinsin mi? Bu işlem geri alınamaz.`)) return;
        try {
            await api(API.adminProducts + '?id=' + encodeURIComponent(id), { method: 'DELETE' });
            flash('Ürün silindi.');
            await loadProducts();
        } catch (e) {
            flash(e.message || 'Silinemedi.', 'error');
        }
    }

    // ─── BOOT ───
    if (getToken()) {
        showDashboard().catch(() => {/* will fall back to login on 401 */});
    }
})();
</script>
</body>
</html>
